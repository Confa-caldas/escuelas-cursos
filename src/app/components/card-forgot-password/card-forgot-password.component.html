<form class="form-login needs-validation" autocomplete="off" [formGroup]="formForgotPassword" (ngSubmit)="forgotPassword()">
    <div class="form-group form-group-custom conteninputlabelform">
        <label class="m-0 labelLoginHome">Selecciona el tipo de documento *.</label>
        <div class="card card-custom-select">
          <div class="content-custom-select">
            <select
              class="form-control inputloginsimulador"
              formControlName="tpDoc"
              (change)="capturar($event.target.value)"
              [class.is-invalid]="(submitted || f.tpDoc.touched) && f.tpDoc.errors"
            >
              <option value="" hidden selected>
                * Selecciona el tipo de documento
              </option>
              <option *ngFor="let dt of dataTpDoc" value="{{ dt.tipoDocumento }}">
                {{ dt.nombre }}
              </option>
            </select>
            <i class="icon-down1 fas fa-chevron-down pl-2"></i>
          </div>
        </div>
        <span
          *ngIf="(submitted || f.tpDoc.touched) && f.tpDoc.errors"
          class="badge badge-pill badge-danger cf-badge d-block mt-2 text-left"
          >DEBES SELECCIONAR UN TIPO DE DOCUMENTO</span
        >
      </div>
    <div class="form-group form-group-custom">
        <label class="m-0 mb-1">Número de documento</label>
        <input type="number" formControlName="document" class="form-control" placeholder="* Número de documento" placement="right" min="1" [class.is-invalid]="getDocument">
        <div *ngIf="getDocument" class="invalid-feedback animate__animated animate__fadeIn animate__fast">
            <span *ngIf="f.document.errors.required" class="badge badge-pill badge-danger d-block mt-2 pt-1 pb-1 pr-2 pl-2 text-left"> NÚMERO DE DOCUMENTO
                ES
                REQUERIDO</span>
        </div>
        <div *ngIf="(f.document.touched) && f.document.errors?.min" class="invalid-feedback animate__animated animate__fadeIn animate__fast">
            <span class="badge badge-pill badge-danger d-block mt-2 pt-1 pb-1 pr-2 pl-2 text-left">DEBES INGRESAR MÍNIMO
                6
                DÍGITOS</span>
        </div>
        <div *ngIf="(f.document.touched) && f.document.errors?.max" class="invalid-feedback animate__animated animate__fadeIn animate__fast">
            <span class="badge badge-pill badge-danger d-block mt-2 pt-1 pb-1 pr-2 pl-2 text-left">DEBES INGRESAR MÁXIMO
                15
                DÍGITOS</span>
        </div>
        <div *ngIf="(f.document.touched) && f.document.errors?.pattern" class="invalid-feedback animate__animated animate__fadeIn animate__fast">
            <span class="badge badge-pill badge-danger d-block mt-2 pt-1 pb-1 pr-2 pl-2 text-left">DEBES INGRESAR
                DÍGITOS
                POSITIVOS</span>
        </div>
    </div>
    <div class="col-md-12 text-left pl-1">
        <div class="form-group"><small class="text-muted" style="font-size: 10px;">
                * Los campos que tienen asterisco son obligatorios
            </small> </div>
    </div>
    <div class="form-group m-0">
        <button [disabled]="utilitiesService.loading" class="btn btn-credits btn-block mt-1 mb-3">
            <span *ngIf="utilitiesService.loading" class="spinner-border spinner-border-sm mr-1"></span>
            Continuar
        </button>
    </div>
</form>
